[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "discord_announcer"
description = "Posts the market sales of corporation wallet divisions to Discord, for Alliance Auth"
readme = "README.md"
keywords = [
    "allianceauth",
    "discord_announcer",
]
license = { file = "LICENSE" }
authors = [
    { name = "fthomas-de" },
]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
# AA 5 for esi.openapi_clients, corptools because the app imports it on
# start: without it pip installed fine and Alliance Auth then failed to boot
dependencies = [
    "allianceauth>=5,<6",
    "allianceauth-corptools",
]
# nothing is posted without the bot, but the page works and says so
optional-dependencies.discordbot = [
    "allianceauth-discordbot",
]
urls.Changelog = "https://github.com/fthomas-de/discord_announcer/blob/master/CHANGELOG.md"
urls."Issue / Bug Reports" = "https://github.com/fthomas-de/discord_announcer/issues"

[tool.hatch.version]
path = "discord_announcer/__init__.py"

[tool.hatch.build]
include = [
    "/discord_announcer",
]
