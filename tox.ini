[tox]
requires =
    tox>=4.2
env_list =
    py312

[testenv]
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
# the package itself pulls in allianceauth and corptools, and with them Django
deps =
    coverage
commands =
    coverage run runtests.py discord_announcer -v 2
    coverage report
    coverage xml
